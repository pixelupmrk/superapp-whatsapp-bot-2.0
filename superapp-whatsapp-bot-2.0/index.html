<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel SuperApp 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-2xl mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-400">SuperApp 2.0</h1>
            <p class="text-slate-400">Centro de Comando - Bot SSH 24h</p>
        </header>

        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div id="status-container" class="mb-6 text-center">
                <span id="badge" class="px-4 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-300">VERIFICANDO...</span>
            </div>

            <div class="flex flex-col justify-center bg-white p-6 rounded-xl min-h-[300px] items-center text-center">
                <p id="msg" class="text-slate-800 font-bold mb-4">Conectando ao banco de dados...</p>
                <img id="qr" class="hidden w-64 h-64 border-4 border-white shadow-lg" src="">
                <p id="instrucao" class="hidden text-slate-500 text-xs mt-4 italic">Aponte o WhatsApp para a tela</p>
            </div>

            <div class="mt-8">
                <label class="block text-sm font-medium mb-2 text-slate-300">Personalidade da IA (Nicho)</label>
                <textarea id="prompt" class="w-full h-32 p-3 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white focus:ring-2 focus:ring-green-500 outline-none transition-all" 
                    placeholder="Ex: Você é um vendedor focado em fechar mentorias de marketing..."></textarea>
                
                <button onclick="salvarConfig()" id="btn-save" class="w-full mt-4 bg-green-600 hover:bg-green-500 text-white py-4 rounded-xl font-bold text-lg transition-all shadow-lg active:scale-95">
                    SALVAR PERSONALIDADE
                </button>
            </div>
        </div>
        
        <p class="text-center text-slate-500 text-[10px] mt-6 uppercase tracking-widest">Sistema Operacional Bot 2.0 - SSH Ativo</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // SUAS CHAVES REAIS JÁ CONFIGURADAS
        const firebaseConfig = {
            apiKey: "AIzaSyAi3LTAIeeD4_-6BmnNBI2kgiR5kLCKgQE",
            authDomain: "superapp-d0368.firebaseapp.com",
            projectId: "superapp-d0368",
            storageBucket: "superapp-d0368.firebasestorage.app",
            messagingSenderId: "469594170619",
            appId: "1:469594170619:web:04339a8c7e64caec0bbc5e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESCUTAR O BOT EM TEMPO REAL
        onSnapshot(doc(db, "instancias", "whatsapp"), (snap) => {
            const badge = document.getElementById('badge');
            const msg = document.getElementById('msg');
            const qrImg = document.getElementById('qr');
            const instr = document.getElementById('instrucao');

            if (snap.exists()) {
                const data = snap.data();
                
                if (data.status === 'online') {
                    badge.innerText = "● BOT ON-LINE";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-green-500 text-white shadow-[0_0_10px_rgba(34,197,94,0.5)]";
                    msg.innerText = "✅ Tudo pronto! O bot está atendendo.";
                    msg.classList.remove('hidden');
                    qrImg.classList.add('hidden');
                    instr.classList.add('hidden');
                } else if (data.qrcode) {
                    badge.innerText = "○ AGUARDANDO CONEXÃO";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-yellow-500 text-black";
                    msg.classList.add('hidden');
                    qrImg.src = data.qrcode;
                    qrImg.classList.remove('hidden');
                    instr.classList.remove('hidden');
                }
            } else {
                msg.innerText = "Aguardando sinal do servidor SSH...";
            }
        }, (err) => {
            console.error("Erro nas Rules:", err);
            document.getElementById('msg').innerText = "Erro de Permissão: Ajuste as Regras no Firebase.";
        });

        // FUNÇÃO PARA SALVAR NICHO
        window.salvarConfig = async () => {
            const btn = document.getElementById('btn-save');
            const promptValue = document.getElementById('prompt').value;
            
            if(!promptValue) return alert("Escreva a personalidade antes de salvar!");

            btn.innerText = "GRAVANDO NA IA...";
            btn.disabled = true;

            try {
                await setDoc(doc(db, "configuracoes", "ia"), { 
                    prompt_vendas: promptValue,
                    ultima_atualizacao: new Date().toISOString()
                }, { merge: true });
                
                alert("Personalidade da IA atualizada!");
            } catch (e) {
                alert("Erro ao salvar: " + e.message);
            } finally {
                btn.innerText = "SALVAR PERSONALIDADE";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
