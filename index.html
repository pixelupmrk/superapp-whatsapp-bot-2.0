<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel SuperApp 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-2xl mx-auto p-6 text-center">
        <h1 class="text-3xl font-bold text-green-400 mb-8">SuperApp 2.0</h1>
        
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
            <div id="status-container" class="mb-4">
                <span id="badge" class="px-4 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-400 uppercase">Conectando ao Firebase...</span>
            </div>

            <div class="bg-white p-4 rounded-xl inline-block min-w-[280px] min-h-[280px] flex items-center justify-center border-4 border-slate-700">
                <p id="msg" class="text-slate-800 font-medium">Aguardando sinal do Bot...</p>
                <img id="qr" class="hidden w-64 h-64" src="">
                <div id="success" class="hidden text-green-600 font-bold text-2xl uppercase italic">✓ Bot Conectado</div>
            </div>

            <div class="mt-8 text-left">
                <label class="text-xs text-slate-400 font-bold uppercase block mb-2">Personalidade da IA (Nicho)</label>
                <textarea id="prompt" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm h-24 outline-none focus:border-green-500" placeholder="Ex: Você é um vendedor amigável..."></textarea>
                <button id="btnSalvar" class="w-full mt-4 bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold transition-all uppercase shadow-lg">Salvar Configuração</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuração corrigida para o projeto bot2-79d05
        const firebaseConfig = {
            apiKey: "AIzaSyAi3LTAIeeD4_-6BmnNBI2kgiR5kLCKgQE",
            authDomain: "bot2-79d05.firebaseapp.com",
            projectId: "bot2-79d05",
            storageBucket: "bot2-79d05.appspot.com",
            messagingSenderId: "1033946903068",
            appId: "1:1033946903068:web:04339a8c7e64caec0bbc5e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESCUTA EM TEMPO REAL: Corrigido para 'instâncias' e 'WhatsApp'
        // conforme o seu print do console do Firebase
        onSnapshot(doc(db, "instâncias", "WhatsApp"), (snap) => {
            const badge = document.getElementById('badge');
            const msg = document.getElementById('msg');
            const qrImg = document.getElementById('qr');
            const success = document.getElementById('success');

            if (snap.exists()) {
                const data = snap.data();
                
                // Lendo o campo 'código QR' com acento e espaço
                if (data['código QR'] && data.status !== 'online') {
                    badge.innerText = "ESCANEIE O QR CODE";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-yellow-500 text-black uppercase";
                    msg.classList.add('hidden');
                    qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(data['código QR']);
                    qrImg.classList.remove('hidden');
                    success.classList.add('hidden');
                } 
                
                if (data.status === 'online') {
                    badge.innerText = "SISTEMA ONLINE";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-green-500 text-white uppercase";
                    msg.classList.add('hidden');
                    qrImg.classList.add('hidden');
                    success.classList.remove('hidden');
                }
            } else {
                badge.innerText = "DOCUMENTO NÃO ENCONTRADO";
            }
        });

        // Função de salvar prompt
        document.getElementById('btnSalvar').onclick = async () => {
            const prompt = document.getElementById('prompt').value;
            try {
                // Criando a coleção 'configurações' (com acento) para manter o padrão
                await setDoc(doc(db, "configurações", "ia"), { prompt_vendas: prompt }, { merge: true });
                alert("✅ Configuração Salva!");
            } catch (e) { 
                alert("❌ Erro ao salvar: " + e.message); 
            }
        };
    </script>
</body>
</html>
