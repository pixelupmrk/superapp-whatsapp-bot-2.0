<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel SuperApp 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-2xl mx-auto p-6 text-center">
        <h1 class="text-3xl font-bold text-green-400 mb-8">SuperApp 2.0</h1>
        
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
            <div id="status-container" class="mb-4">
                <span id="badge" class="px-4 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-400 uppercase">Sincronizando...</span>
            </div>

            <div class="bg-white p-4 rounded-xl inline-block min-w-[280px] min-h-[280px] flex items-center justify-center border-4 border-slate-700">
                <p id="msg" class="text-slate-800 font-medium">Aguardando sinal do Bot...</p>
                <img id="qr" class="hidden w-64 h-64" src="">
                <div id="success" class="hidden text-green-600 font-bold text-2xl uppercase italic">✓ Conectado</div>
            </div>

            <div class="mt-8 text-left">
                <label class="text-xs text-slate-400 font-bold uppercase block mb-2">Personalidade da IA (Nicho)</label>
                <textarea id="prompt" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm h-24 outline-none focus:border-green-500" placeholder="Ex: Você é um vendedor amigável..."></textarea>
                <button onclick="salvar()" class="w-full mt-4 bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold transition-all uppercase">Salvar Configuração</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Sua configuração real do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAi3LTAIeeD4_-6BmnNBI2kgiR5kLCKgQE",
            authDomain: "superapp-d0368.firebaseapp.com",
            projectId: "superapp-d0368",
            storageBucket: "superapp-d0368.firebasestorage.app",
            messagingSenderId: "469594170619",
            appId: "1:469594170619:web:04339a8c7e64caec0bbc5e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Escuta em tempo real a coleção 'instancias' que o bot no SSH atualiza
        onSnapshot(doc(db, "instancias", "whatsapp"), (snap) => {
            const badge = document.getElementById('badge');
            const msg = document.getElementById('msg');
            const qrImg = document.getElementById('qr');
            const success = document.getElementById('success');

            if (snap.exists()) {
                const data = snap.data();
                if (data.status === 'online') {
                    badge.innerText = "ONLINE";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-green-500 text-white";
                    msg.classList.add('hidden');
                    qrImg.classList.add('hidden');
                    success.classList.remove('hidden');
                } else if (data.qrcode) {
                    badge.innerText = "AGUARDANDO ESCANEAMENTO";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-yellow-500 text-black";
                    msg.classList.add('hidden');
                    qrImg.src = data.qrcode;
                    qrImg.classList.remove('hidden');
                    success.classList.add('hidden');
                }
            }
        });

        window.salvar = async () => {
            const prompt = document.getElementById('prompt').value;
            try {
                await setDoc(doc(db, "configuracoes", "ia"), { prompt_vendas: prompt }, { merge: true });
                alert("Configuração Salva!");
            } catch (e) { alert("Erro ao salvar: " + e.message); }
        };
    </script>
</body>
</html>
