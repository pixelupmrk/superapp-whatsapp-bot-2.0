<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel SuperApp 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="max-w-2xl mx-auto p-6 text-center">
        <h1 class="text-3xl font-bold text-green-400 mb-8">SuperApp 2.0</h1>
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
            <div class="mb-4">
                <span id="badge" class="px-4 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-400 uppercase">Sincronizando...</span>
            </div>
            <div class="bg-white p-4 rounded-xl inline-block min-w-[280px] min-h-[280px] flex items-center justify-center">
                <p id="msg" class="text-slate-800 font-medium">Aguardando sinal do Bot...</p>
                <img id="qr" class="hidden w-64 h-64" src="">
                <div id="success" class="hidden text-green-600 font-bold text-2xl uppercase">✓ Conectado</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAi3LTAIeeD4_-6BmnNBI2kgiR5kLCKgQE",
            authDomain: "bot2-79d05.firebaseapp.com",
            projectId: "bot2-79d05",
            appId: "1:1033946903068:web:04339a8c7e64caec0bbc5e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // LENDO 'instancias' -> 'whatsapp' (SEM ACENTOS)
        onSnapshot(doc(db, "instancias", "whatsapp"), (snap) => {
            const badge = document.getElementById('badge');
            const msg = document.getElementById('msg');
            const qrImg = document.getElementById('qr');
            const success = document.getElementById('success');

            if (snap.exists()) {
                const data = snap.data();
                if (data.qrcode) {
                    badge.innerText = "ESCANEIE O QR CODE";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-yellow-500 text-black";
                    msg.classList.add('hidden');
                    qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(data.qrcode);
                    qrImg.classList.remove('hidden');
                } else if (data.status === 'online') {
                    badge.innerText = "SISTEMA ONLINE";
                    badge.className = "px-4 py-1 rounded-full text-xs font-bold bg-green-500 text-white";
                    qrImg.classList.add('hidden');
                    success.classList.remove('hidden');
                }
            } else {
                badge.innerText = "AGUARDANDO CRIAÇÃO DO DOCUMENTO";
            }
        });
    </script>
</body>
</html>
